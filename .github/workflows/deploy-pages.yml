name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install

      - name: Build
        # O base vem do GITHUB_REPOSITORY no vite.config.ts (não depende de VITE_BASE aqui).
        run: npm run build

      - name: Conferir base no index (evita página em branco)
        run: |
          test -f dist/index.html
          grep -q "/${{ github.event.repository.name }}/assets/" dist/index.html || (echo "ERRO: dist/index.html não usa o base /${{ github.event.repository.name }}/ — veja VITE_BASE e vite.config." && exit 1)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
